<section class="flex h-screen ">
  <!-- Left: Login Form -->
  <div class="flex items-center justify-center w-full md:w-full p-6 right-section"
    [ngStyle]="{'property': theme === 'light' ? 'background-color: #f9f9f9;' : 'background-color: #1a202c;'}">
    <div class="w-3/4 max-w-md">
      <div class="text-center mb-6">
        <li>
          <button class="dropdown-item d-flex justify-content-between align-items-center" (click)="toggleTheme()">
            <span><i class="fas" [ngClass]="theme === 'light' ? 'fa-moon' : 'fa-sun'"></i>
              {{ theme === "light" ? "Dark Mode" : "Light Mode" }}
            </span>
            <i class="fas" [ngClass]="theme === 'light' ? 'fa-toggle-off' : 'fa-toggle-on'"></i>
          </button>
        </li>
        <img src="assets/images/SPOTY CHAT LOGO (2).svg" alt="SpottyChat Logo" class="mx-auto mb-4 w-36" />
        <h2 class="text-2xl font-semibold"
          [ngClass]="{'text-gray-800': theme === 'light', 'text-white': theme === 'dark'}">Welcome Back 👋</h2>
        <p class="text-gray-500">Login to continue chatting</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="mb-4">
          <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
          <input id="username" formControlName="username" type="text" placeholder="Enter your username"
            [ngClass]="{'text-gray-800': theme === 'light', 'text-white': theme === 'dark'}"
            class="w-full mt-1 p-2 border border-gray-300 rounded-md text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-[#ffc258] focus:border-[#ffc258]"
            [class.border-red-500]="loginForm.get('username')?.hasError('required') && loginForm.get('username')?.touched"
            aria-describedby="username-error" />
          <p *ngIf="loginForm.get('username')?.hasError('required') && loginForm.get('username')?.touched"
            id="username-error" class="text-red-500 text-xs mt-1">Username is required</p>
        </div>

        <div class="relative mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="Enter your password"
            [ngClass]="{'text-gray-800': theme === 'light', 'text-white': theme === 'dark'}"
            class="w-full mt-1 p-2 border border-gray-300 rounded-md text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-[#ffc258] focus:border-[#ffc258]"
            [class.border-red-500]="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched"
            aria-describedby="password-error" />
          <button type="button" (click)="togglePasswordVisibility()"
            class="absolute right-3 top-9 text-gray-500 hover:text-gray-700" aria-label="Toggle password visibility"
            [attr.aria-pressed]="showPassword">
            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
          <p *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched"
            id="password-error" class="text-red-500 text-xs mt-1">Password is required</p>
        </div>

        <div class="mb-4">
          <button type="submit" [disabled]="loginForm.invalid || isLoading"
            class="w-full py-2 px-4 bg-indigo-600 text-white font-semibold rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:bg-gray-400">
            {{ isLoading ? 'Logging in...' : 'Login' }}
          </button>
        </div>

        <div class="text-center">
          <span class="text-sm text-gray-500">Don't have an account?</span>
          <button type="button" (click)="goToRegister()"
            class="text-sm font-medium text-indigo-600 hover:text-indigo-700 font-medium" style="color: #ffc258;">
            Sign up
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Right: Branding Image -->
  <div class="hidden md:block w-1/2 bg-cover bg-center bgImage"
    style="background-image: url('assets/images/chatBg.svg');">
  </div>
</section>
<lib-toastify-toast-container [position]="'top-right'"></lib-toastify-toast-container>
<app-loader></app-loader>
