<section class="vh-100 d-flex">


  <!-- Right: Branding Image -->
  <div class="col-6 d-none d-md-block p-0  signup-image">
    <div class="h-100 w-100" style="
      background-image: url('assets/images/auth-logo.svg');
      background-size: cover;
      background-position: center;
      border-top-left-radius: 20px;
      border-bottom-left-radius: 20px;
    ">
    </div>
  </div>

  <!-- Left: Registration Form -->
  <div class="col-12 col-md-6 d-flex align-items-center justify-content-center signup-form-container ">
    <div class="w-75">
      <div class="text-center mb-4">
        <img src="assets/images/SPOTY CHAT LOGO (2).svg" alt="SpottyChat Logo" />
        <h2 class="fw-bold mt-3">Create Your Account 👋</h2>
        <p class="text-muted">Join SpottyChat and start connecting</p>
      </div>

      <div class="mb-3">
        <div *ngIf="imagePreview !== null;" class="image-preview-wrapper">
          <img *ngIf="imagePreview; else placeholder" [src]="imagePreview" alt="Avatar preview" class="image-preview" />
          <ng-template #placeholder>
            <div class="placeholder">+</div>
          </ng-template>
          <button *ngIf="imagePreview;" type="button" class="btn btn-sm remove-image-btn" (click)="removeImage()"
            aria-label="Remove image">
            &times;
          </button>
        </div>
        <input type="file" accept="image/*" (change)="onImageSelected($event)" hidden #fileInput />
        <button type="button" class="btn btn-outline-secondary mt-2" (click)="fileInput.click()">
          Choose image
        </button>
      </div>


      <form [formGroup]="registerForm" (ngSubmit)="register()">
        <div class="responsive-row">
          <div class="mb-3 w-100">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Username</mat-label>
              <input matInput formControlName="username" placeholder="Enter your username" />
              <mat-error
                *ngIf="registerForm.get('username')?.hasError('required') && registerForm.get('username')?.touched">
                Username is required
              </mat-error>
            </mat-form-field>
          </div>

          <div class="mb-3 w-100">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Phone</mat-label>
              <input matInput formControlName="phone" placeholder="Enter your phone number" />
              <mat-error *ngIf="registerForm.get('phone')?.hasError('required') && registerForm.get('phone')?.touched">
                Phone number is required
              </mat-error>
            </mat-form-field>
          </div>
        </div>


        <div class="mb-3 ">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" placeholder="Enter your email" />
            <mat-error *ngIf="registerForm.get('email')?.hasError('required') && registerForm.get('email')?.touched">
              Email is required
            </mat-error>
            <mat-error *ngIf="registerForm.get('email')?.hasError('email') && registerForm.get('email')?.touched">
              Enter a valid email address
            </mat-error>
          </mat-form-field>
        </div>

        <div class="mb-3 position-relative">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Password</mat-label>
            <input matInput [type]="showPassword ? 'text' : 'password'" formControlName="password"
              placeholder="Enter your password" />
            <button matSuffix type="button" (click)="togglePasswordVisibility()" class="show-password"
              [attr.aria-label]="'Toggle password visibility'" [attr.aria-pressed]="showPassword">
              <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error
              *ngIf="registerForm.get('password')?.hasError('required') && registerForm.get('password')?.touched">
              Password is required
            </mat-error>
          </mat-form-field>
        </div>

        <div class="d-grid mb-3">
          <button mat-raised-button color="primary" [ngClass]="{'disabled': registerForm.invalid}" type="submit"
            [disabled]="registerForm.invalid || isLoading">
            {{ isLoading ? 'Registering...' : 'Sign Up' }}
          </button>
        </div>

        <div class="text-center">
          <span class="text-muted">Already have an account?</span>
          <button mat-button type="button" (click)="goToLogin()">Login</button>
        </div>
      </form>
    </div>
  </div>
</section>

<lib-toastify-toast-container [position]="'top-right'"></lib-toastify-toast-container>
<app-loader></app-loader>
