<div class="signup-wrapper">
  <div class="signup-image">
    <img src="assets/images/auth-logo.svg" alt="Signup Illustration" />
  </div>

  <div class="signup-form-container">
    <mat-card class="signup-card" @fadeIn>
      <mat-card-header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <mat-card-title>Sign Up</mat-card-title>
        <div class="image-upload-container">
          <button mat-raised-button color="primary" (click)="fileInput.click()" class="choose-file-btn"
            *ngIf="!imagePreview" style="width: 100px; height: 100px">
            Choose Profile Image
          </button>
          <input type="file" hidden (change)="onImageSelected($event)" #fileInput />
          <div class="image-preview-wrapper" *ngIf="imageFile">
            <img [src]="imagePreview" alt="Image Preview" class="image-preview" />
            <button mat-icon-button (click)="removeImage()" class="remove-image-btn">
              <mat-icon>close</mat-icon>
            </button>
          </div>
        </div>
      </mat-card-header>

      <mat-card-content>


        <form [formGroup]="registerForm" (ngSubmit)="register()" class="register-form">
          <mat-form-field appearance="fill">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" placeholder="Enter your username" />
            <mat-error *ngIf="registerForm.get('username')?.hasError('required')">Username is required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" placeholder="Enter your email" />
            <mat-error *ngIf="registerForm.get('email')?.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="registerForm.get('email')?.hasError('email')">Enter a valid email</mat-error>
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Phone</mat-label>
            <input matInput formControlName="phone" placeholder="Enter your phone number" />
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" placeholder="Enter your password" />
            <mat-error *ngIf="registerForm.get('password')?.hasError('required')">Password is required</mat-error>
            <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
              Password must be at least 8 characters long
            </mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid">
            Sign Up
          </button>
          <button mat-button type="button" (click)="goToLogin()">Already have an account? Login</button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<lib-toastify-toast-container [position]="'top-right'"></lib-toastify-toast-container>
